# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
# (Original configuration using TIAGo dual-arm naming; do not modify.)
cspace:
    - arm_right_1_joint
    - arm_right_2_joint
    - arm_right_3_joint
    - arm_right_4_joint
    - arm_right_5_joint
    - arm_right_6_joint
    - arm_right_7_joint
default_q: [
    -0.0,0.0004,-0.0,0.0,-0.0,0.0391,-0.0
]

acceleration_limits: [
   10,10,10,10,10,10,10
]

jerk_limits: [
   10000,10000,10000,10000,10000,10000,10000
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.

cspace_to_urdf_rules:
    # Base joints (omni_base - no roller joints, just 4 wheels)
    - {name: wheel_front_left_joint, rule: fixed, value: 0.0}
    - {name: wheel_front_right_joint, rule: fixed, value: 0.0}
    - {name: wheel_rear_left_joint, rule: fixed, value: 0.0}
    - {name: wheel_rear_right_joint, rule: fixed, value: 0.0}
    # Torso
    - {name: torso_lift_joint, rule: fixed, value: 0.0}
    # Left arm (fixed - we only control right arm)
    - {name: arm_left_1_joint, rule: fixed, value: 0.0}
    - {name: arm_left_2_joint, rule: fixed, value: 0.0}
    - {name: arm_left_3_joint, rule: fixed, value: 0.0}
    - {name: arm_left_4_joint, rule: fixed, value: 0.0}
    - {name: arm_left_5_joint, rule: fixed, value: 0.0}
    - {name: arm_left_6_joint, rule: fixed, value: 0.0}
    - {name: arm_left_7_joint, rule: fixed, value: 0.0}
    # Head (fixed)
    - {name: head_1_joint, rule: fixed, value: 0.0}
    - {name: head_2_joint, rule: fixed, value: 0.0}
    # Grippers (fixed)
    - {name: gripper_left_left_finger_joint, rule: fixed, value: 0.0}
    - {name: gripper_left_right_finger_joint, rule: fixed, value: 0.0}
    - {name: gripper_right_left_finger_joint, rule: fixed, value: 0.0}
    - {name: gripper_right_right_finger_joint, rule: fixed, value: 0.0}

# Lula uses collision spheres to define the robot geometry in order to avoid
# collisions with external obstacles.  If no spheres are specified, Lula will
# not be able to avoid obstacles.

collision_spheres:
